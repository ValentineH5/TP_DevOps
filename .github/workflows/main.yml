name: Build and deploy application

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push database
        uses: docker/build-push-action@v6
        with:
          context: ./TD_partie_02/tp-devops-correction-docker/database
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-database:${{ github.sha }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: ./TD_partie_02/tp-devops-correction-docker/simple-api
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-simple-api:${{ github.sha }}

      - name: Build and push HTTP server
        uses: docker/build-push-action@v6
        with:
          context: ./TD_partie_02/tp-devops-correction-docker/http-server
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-http-server:${{ github.sha }}

      - name: Build and push Front
        uses: docker/build-push-action@v6
        with:
          context: ./TD_partie_02/tp-devops-correction-docker/front
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-front:${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible

      - name: Install Docker collection
        run: ansible-galaxy collection install community.docker

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Configure SSH known_hosts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy with Ansible
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          cd TD_partie_03/ansible
          printf '%s\n' "$ANSIBLE_VAULT_PASSWORD" > "$RUNNER_TEMP/vault-password"
          chmod 600 "$RUNNER_TEMP/vault-password"
          ansible-playbook \
            -i inventories/setup.yml \
            playbook.yml \
            --private-key "$HOME/.ssh/deploy_key" \
            --extra-vars "dockerhub_username=$DOCKERHUB_USERNAME image_tag=$GITHUB_SHA" \
            --vault-password-file "$RUNNER_TEMP/vault-password"