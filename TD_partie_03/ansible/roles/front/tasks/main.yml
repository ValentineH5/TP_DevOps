---
- name: Pull front image
  community.docker.docker_image:
    name: "{{ dockerhub_username }}/tp-devops-front:{{ image_tag }}"
    source: pull

- name: Start front container
  community.docker.docker_container:
    name: front
    image: "{{ dockerhub_username }}/tp-devops-front:{{ image_tag }}"
    state: started
    restart_policy: always
    networks:
      - name: app-network
    ports:
      - "80:80"