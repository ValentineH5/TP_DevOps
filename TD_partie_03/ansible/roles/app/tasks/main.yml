---
- name: Pull API image
  community.docker.docker_image:
    name: "{{ app_image }}"
    source: pull

- name: Start API container
  community.docker.docker_container:
    name: simple-api
    image: "{{ app_image }}"
    pull: true
    state: started
    restart_policy: unless-stopped
    env: "{{ app_env }}"
    published_ports:
      - "{{ app_port }}:8080"
    networks:
      - name: "{{ docker_network_name }}"