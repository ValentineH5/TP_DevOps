---
- name: Copy database build context
  ansible.builtin.copy:
    src: "/mnt/c/00_Donees/0_EPF/DevOps/TP_DevOps/TD_partie_02/tp-devops-correction-docker/database/"
    dest: /opt/myapp/database/
    mode: preserve

- name: Build database image
  community.docker.docker_image:
    name: "{{ database_image }}"
    source: build
    build:
      path: /opt/myapp/database

- name: Create database volume
  community.docker.docker_volume:
    name: "{{ database_volume_name }}"
    state: present

- name: Start PostgreSQL container
  community.docker.docker_container:
    name: database
    image: "{{ database_image }}"
    state: started
    restart_policy: unless-stopped
    env: "{{ database_env }}"
    published_ports:
      - "{{ database_port }}:5432"
    volumes:
      - "{{ database_volume_name }}:/var/lib/postgresql/data"
    networks:
      - name: "{{ docker_network_name }}"