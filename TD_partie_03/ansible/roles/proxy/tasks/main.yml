---
- name: Pull HTTP server image
  community.docker.docker_image:
    name: "{{ dockerhub_username }}/tp-devops-http-server"
    tag: "{{ image_tag }}"
    source: pull

- name: Start HTTP server container
  community.docker.docker_container:
    name: httpd
    image: "{{ dockerhub_username }}/tp-devops-http-server:{{ image_tag }}"
    pull: true
    state: started
    restart_policy: unless-stopped
    published_ports:
      - "{{ proxy_port }}:80"
    networks:
      - name: "{{ docker_network_name }}"