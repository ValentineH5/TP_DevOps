---
- name: Copy HTTP server build context
  ansible.builtin.copy:
    src: "/mnt/c/00_Donees/0_EPF/DevOps/TP_DevOps/TD_partie_02/tp-devops-correction-docker/http-server/"
    dest: /opt/myapp/http-server/
    mode: preserve

- name: Build HTTP server image
  community.docker.docker_image:
    name: "{{ proxy_image }}"
    source: build
    build:
      path: /opt/myapp/http-server

- name: Start HTTP server container
  community.docker.docker_container:
    name: httpd
    image: "{{ proxy_image }}"
    state: started
    restart_policy: unless-stopped
    published_ports:
      - "{{ proxy_port }}:80"
    networks:
      - name: "{{ docker_network_name }}"