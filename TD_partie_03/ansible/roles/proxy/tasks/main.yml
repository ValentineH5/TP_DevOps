---
- name: Pull HTTP server image
  community.docker.docker_image:
    name: "{{ proxy_image }}"
    source: pull

- name: Start HTTP server container
  community.docker.docker_container:
    name: httpd
    image: "{{ proxy_image }}"
    pull: true
    state: started
    restart_policy: unless-stopped
    published_ports:
      - "{{ proxy_port }}:80"
    networks:
      - name: "{{ docker_network_name }}"