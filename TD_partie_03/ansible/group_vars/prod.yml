---
docker_network_name: my-network

database_image: "{{ dockerhub_username }}/database:{{ image_tag }}"
app_image: "{{ dockerhub_username }}/simple-api:{{ image_tag }}"
proxy_image: "{{ dockerhub_username }}/http-server:{{ image_tag }}"

database_volume_name: db-volume

database_port: "5432"
app_port: "8080"
proxy_port: "80"

database_env:
  POSTGRES_PASSWORD: "{{ postgres_password }}"

app_env:
  DATABASE_HOST: "database"
  DATABASE_PASSWORD: "{{ api_database_password }}"